name: Download Item Images

on:
  schedule:
    # Runs every day at 4:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  download-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Download images from API
        run: node scripts/download-images.mjs
        env:
          IMAGES_BASE_URL: ${{ secrets.IMAGES_BASE_URL }}
      
      - name: Check for new or changed files
        id: git-check
        run: |
          git add public/img/items/
          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: auto-download item images [skip ci]"
          git push
