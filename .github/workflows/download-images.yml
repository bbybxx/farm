name: Download Item Images from buddy.farm

on:
  schedule:
    # Запускается каждый день в 4:00 UTC (7:00 MSK)
    - cron: '0 4 * * *'
  workflow_dispatch: # Позволяет запустить вручную

jobs:
  download-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Разрешаем запись для коммитов
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Download images from API
        run: node scripts/download-images.mjs
      
      - name: Check for new or changed files
        id: git-check
        run: |
          git add public/img/items/
          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: auto-download item images from buddy.farm [skip ci]"
          git push
